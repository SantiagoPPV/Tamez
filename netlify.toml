# =============================================================================
# Sistemas a la medida · software interno — despliegue en Netlify
#
# La aplicación vive en la RAÍZ del repositorio (Vite + React). En la interfaz
# de Netlify (Site configuration → Build & deploy) los valores deben quedar así:
#   Base directory:     (vacío)
#   Build command:      npm run ci
#   Publish directory:  dist
# Si quedó «tamez-web» como Base directory o el plugin de Next.js instalado
# desde la interfaz (del sitio anterior), hay que quitarlos: ver docs/DEPLOY.md.
#
# `npm run ci` corre lint, las pruebas automáticas (incluida la prueba de
# aceptación CE-INV) y el build. Si una prueba falla, no se publica nada.
# =============================================================================

[build]
  command = "npm run ci"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Vite, TypeScript, Tailwind y Vitest están en devDependencies: sin esto, un
  # NODE_ENV=production durante la instalación las omite y el build falla.
  NPM_FLAGS = "--include=dev --no-audit --no-fund"

# --- Ambientes ---------------------------------------------------------------
# Producción: la rama de producción del sitio (main), con las variables de
#   Supabase del sitio.
# Pruebas: deploy previews y branch deploys. Arrancan en MODO DEMOSTRACIÓN
#   (datos de CE-INV en el navegador) para que una rama en revisión nunca
#   escriba en la base de producción. Para probar contra una base de pruebas,
#   define en Netlify las variables de ese contexto y quita VITE_DEMO_ONLY.
# Desarrollo: local, con `npm run dev` (ver README.md).
[context.deploy-preview.environment]
  VITE_DEMO_ONLY = "1"

[context.branch-deploy.environment]
  VITE_DEMO_ONLY = "1"

# --- Rutas ---------------------------------------------------------------------
# Aplicación de una sola página: toda ruta la resuelve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Cabeceras -----------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Software interno: nunca se indexa.
    X-Robots-Tag = "noindex, nofollow"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
